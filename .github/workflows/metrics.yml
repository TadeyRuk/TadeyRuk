name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics-left:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Left side
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.SECRET_RUKKAN }}
          filename: metrics_left.svg
          committer_message: "Update metrics_left.svg - [Skip GitHub Action]"
          base: header, activity, community, repositories, metadata
          plugins_errors_fatal: no
          config_timezone: Asia/Manila

          plugin_lines: yes

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size

          plugin_topics: yes
          plugin_topics_limit: 8
          plugin_topics_mode: icons

  metrics-right:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Right side
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.SECRET_RUKKAN }}
          filename: metrics_right.svg
          committer_message: "Update metrics_right.svg - [Skip GitHub Action]"
          base: ""
          plugins_errors_fatal: no
          config_timezone: Asia/Manila

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_stars: yes
          plugin_stars_limit: 4
